<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>クラス連絡</title>
<style>
body { font-family: system-ui, -apple-system, "メイリオ", sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; background:#fafafa; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }

/* ---- おみくじ結果、スケジュール ---- */
.omikuji-result { 
  margin-top:8px; padding:10px; background:#fff7e6;
  border-radius:8px; border-left:4px solid #ff9500;
  font-size:14px; text-align:center; display:none;
}
.schedule-display { 
  margin-top:10px; padding:10px; background:#f0f0f0; 
  border-left:4px solid #4facfe; border-radius:6px; display:none; 
}
.schedule-date { font-weight:600; color:#4facfe; margin-bottom:4px; }
.schedule-content { font-size:14px; color:#333; }

.date-buttons { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }

/* ================================
   ✨ 華やかなボタンスタイル
   ================================ */
/* --- 華やかなボタンスタイル（色を少し濃く） --- */
.fancy-btn {
  padding: 10px 16px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  color: white;
  transition: transform 0.2s, box-shadow 0.2s;
}

/* 日付ボタン（青 → 濃く） */
.fancy-blue {
  background: linear-gradient(135deg, #5ed4ff 0%, #3e7bff 100%);
  box-shadow: 0 4px 10px rgba(62, 123, 255, 0.45);
}

.fancy-blue:hover {
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 6px 14px rgba(62, 123, 255, 0.65);
}

.fancy-blue:active {
  transform: scale(0.97);
}

/* おみくじボタン（黄金 → 濃く） */
.fancy-gold {
  background: linear-gradient(135deg, #f5c242 0%, #f48c3e 100%);
  box-shadow: 0 4px 10px rgba(244, 140, 62, 0.45);
}

.fancy-gold:hover {
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 6px 14px rgba(244, 140, 62, 0.65);
}

.fancy-gold:active {
  transform: scale(0.97);
}

</style>
</head>

<body>

<header>
  <h1>5月28日（木）</h1>
  <div id="status" style="margin-left:auto"></div>
</header>

<!-- --- おみくじ --- -->
<div class="date-buttons">
  <button class="omikuji-button fancy-btn fancy-gold" onclick="drawOmikuji()">🎯 おみくじ 1日2回</button>
</div>
<div id="omikujiResult" class="omikuji-result"></div>

<!-- --- スケジュール --- -->
<div class="date-buttons">
 <button class="date-button fancy-btn fancy-blue" onclick="showSchedule('today')">本日</button>
  <button class="date-button fancy-btn fancy-blue" onclick="showSchedule('tomorrow')">明日</button>
  <button class="date-button fancy-btn fancy-blue" onclick="showSchedule('following')">明後日</button>
  <button class="date-button fancy-btn fancy-blue" onclick="showSchedule('notice')">諸連絡</button>

 

</div>

<div id="scheduleDisplay" class="schedule-display">
  <div id="scheduleDate" class="schedule-date"></div>
  <div id="scheduleContent" class="schedule-content"></div>
</div>

 

<br/><br/>

<!-- Webページ -->
<div id="drawArea">
  <iframe src="https://ipadmeet.github.io/hikariplay/" allowfullscreen style="width:100%;height:300px;border:none;border-radius:6px;"></iframe>
</div>



<script>
// ===== おみくじ・スケジュール =====
const scheduleData = {
  'today': { date: '本日', content: '<div>09時05分～09時35分：英語L</div><div>09時50分～11時10分：英語R</div><div>11時25分～12時55分：国語</div><div>13時35分～15時40分：地歴公民（休憩5分）</div>' },
 'tomorrow': { date: '明日', content: '<div>選挙管理委員会13時10分@大会議室</div><div>09時05分～10時15分：数学ⅠA</div><div>10時30分～11時40分：数学ⅡBC</div><div>11時55分～12時55分：情報</div><div>13時35分～14時35分：理科基礎</div><div>14時40分～15時20分：事故採点</div>'  },
  'following': { date: '明後日', content: '<div>4限：倫理</div>' },
 
  'notice': { date: '諸連絡', content: '<div>5/29（金）選挙管理委員会13時10分@大会議室</div><div>来週から夏服</div><div>趣味は勉強、特技はテスト</div><div>退かぬ、媚びぬ、省みぬ</div>' }

};

const omikujiResults = [
  {name:'大狂',text:'隕石注意'},
  {name:'凶',text:'水鉄砲で撃たれる'},
  {name:'吉',text:'常北ファームで愛のささやき'},
  {name:'小吉',text:'脳筋大爆発！'},
  {name:'中吉',text:'浜田の頭ポンポン'},
  {name:'大吉',text:'正義の味方になれる'}
];

function getTodayKey(){ const t=new Date(); return t.getFullYear()+"-"+(t.getMonth()+1)+"-"+t.getDate(); }
function getDrawCount(){ const k=getTodayKey(); const d=JSON.parse(localStorage.getItem("omikujiCount"))||{}; return d[k]||0; }
function incrementDrawCount(){ const k=getTodayKey(); const d=JSON.parse(localStorage.getItem("omikujiCount"))||{}; d[k]=(d[k]||0)+1; localStorage.setItem("omikujiCount",JSON.stringify(d)); }
function getSecondResult(){ return JSON.parse(localStorage.getItem(getTodayKey()+"-secondResult")); }
function setSecondResult(r){ localStorage.setItem(getTodayKey()+"-secondResult",JSON.stringify(r)); }

function drawOmikuji(){
  const count=getDrawCount();
  const box=document.getElementById("omikujiResult");
  box.style.display="block";
  if(count===0||count===1){
    const r=Math.floor(Math.random()*omikujiResults.length);
    const res=omikujiResults[r];
    if(count===1) setSecondResult(res);
    incrementDrawCount();
    box.innerHTML=`今日の運勢：<strong>${res.name}</strong><br>${res.text}`;
  }else{
    const saved=getSecondResult();
    box.innerHTML=saved?`今日の運勢：<strong>${saved.name}</strong><br>${saved.text}`:"（2回目の結果がありません）";
  }
}

function showSchedule(k){
  document.getElementById("scheduleDate").textContent=scheduleData[k].date;
  document.getElementById("scheduleContent").innerHTML=scheduleData[k].content;
  document.getElementById("scheduleDisplay").style.display="block";
}


</script>
</body>
</html>
